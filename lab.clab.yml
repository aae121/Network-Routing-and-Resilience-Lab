name: routing-lab

topology:
  nodes:
    r1:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/r1/frr.conf
      enforce-startup-config: true
    r2:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/r2/frr.conf
      enforce-startup-config: true
    r3:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/r3/frr.conf
      enforce-startup-config: true
    r4:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/r4/frr.conf
      enforce-startup-config: true

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r1:eth2", "r3:eth2"]
    - endpoints: ["r3:eth3", "r4:eth1"]
    - endpoints: ["r1:eth3", "r4:eth2"]

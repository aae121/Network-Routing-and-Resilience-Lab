frr version 10.7.1_git
frr defaults traditional
hostname r3
domainname localdomain
log stdout
service integrated-vtysh-config
!
ip prefix-list FROM-R4 seq 10 permit 10.2.0.1/32
ip prefix-list TO-R4 seq 10 permit 10.1.0.1/32
!
interface eth1
 ip address 10.0.23.2/30
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth2
 ip address 10.0.13.2/30
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth3
 ip address 10.0.34.1/30
exit
!
router bgp 65001
 bgp router-id 3.3.3.3
 neighbor 10.0.34.2 remote-as 65002
 !
 address-family ipv4 unicast
  network 10.1.0.1/32
  neighbor 10.0.34.2 prefix-list FROM-R4 in
  neighbor 10.0.34.2 prefix-list TO-R4 out
 exit-address-family
exit
!
router ospf
 ospf router-id 3.3.3.3
 redistribute bgp
 network 10.0.13.0/30 area 0
 network 10.0.23.0/30 area 0
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0003.00
exit
!
router pim
 no autorp discovery
exit
!
